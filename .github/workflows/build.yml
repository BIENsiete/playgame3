name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add PS3DEV to PATH
      run: echo "/usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/spu/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        sudo apt-get -y update
        sudo apt-get -y install autoconf automake bison build-essential clang \
          flex git libelf-dev libgmp3-dev libncurses5-dev libssl-dev \
          libtool-bin patch pkg-config python3 python3-dev python-is-python3 \
          texinfo wget zlib1g-dev

    - name: Cache PS3DEV toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: /usr/local/ps3dev
        key: ps3dev-toolchain-v1-${{ runner.os }}

    - name: Build PS3DEV toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/ps3dev/ps3toolchain.git /tmp/ps3toolchain
        cd /tmp/ps3toolchain
        sudo -E ./toolchain.sh
        cd /
        sudo rm -Rf /tmp/ps3toolchain

    - name: Verify toolchain
      run: |
        ppu-g++ --version
        make_self --version 2>&1 || true
        make_pkg --version 2>&1 || true

    - name: Build project
      run: |
        make clean
        make all

    - name: Create PKG
      run: |
        make pkg

    - name: Upload PKG artifact
      uses: actions/upload-artifact@v4
      with:
        name: playgame3-pkg
        path: playgame3.pkg
        if-no-files-found: error

    - name: Upload SELF artifact
      uses: actions/upload-artifact@v4
      with:
        name: playgame3-self
        path: playgame3.self
        if-no-files-found: error
